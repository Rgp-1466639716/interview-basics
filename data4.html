<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      //扁平化数组
      //flat嵌套规模适中 兼容flat
      const array1 = [1, [2, 3, [4, 5]]];
      const arr1 = array1.flat(Infinity);
      // 递归 容易爆栈
      function flatArray1(arr) {
        const result = [];
        arr.forEach((item) => {
          if (Array.isArray(item)) {
            result.push(...flatArray1(item));
          } else {
            result.push(item);
          }
          return result;
        });
      }
      // while 和some
      function flatArray2(arr) {
        while (arr.some(Array.isArray)) {
          arr = [].concat(...arr);
        }
      }
    </script>
  </body>
</html>
